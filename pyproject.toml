[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "radar-publico-cuiaba"
version = "0.1.0"
description = "Inteligência comercial sobre compras públicas de Cuiabá"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "tenacity>=9,<10",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
radar-cuiaba = "radar_publico.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["radar_publico"]

[tool.hatch.build.targets.wheel]
packages = ["src/radar_publico"]
